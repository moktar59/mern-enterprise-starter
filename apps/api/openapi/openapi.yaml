openapi: 3.1.0
info:
  title: MERN Enterprise Starter API
  version: 0.3.0
  summary: Versioned HTTP API contract for the MERN Enterprise Starter.
  description: |
    This specification defines the initial versioned API contract, including
    the persistent items endpoint and pagination conventions.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://127.0.0.1:3000
    description: Local development server
security: []
tags:
  - name: Authentication
    description: Local email/password authentication.
  - name: Items
    description: Example persistent collection used to establish API conventions.
paths:
  /api/v1/auth/register:
    post:
      operationId: registerLocalUser
      tags: [Authentication]
      summary: Register an account without issuing a token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Account created. }
        "409": { description: Email already registered. }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/login:
    post:
      operationId: loginLocalUser
      tags: [Authentication]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          {
            description: Credentials verified.,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/AccessTokenResponse" } },
              },
          }
        "401": { description: Generic invalid-credentials response. }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get authenticated profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authenticated profile returned. }
        "401": { description: "Missing, invalid, or expired token." }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/items:
    get:
      operationId: listItems
      tags: [Items]
      summary: List items
      description: |
        Returns persisted items ordered by stable item ID. Pagination defaults
        to page 1 and 10 records per page. A page beyond the final page returns
        200 with an empty records array and metadata calculated from MongoDB.
        Invalid explicitly supplied pagination parameters return 422.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Must be a positive integer.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
        - name: perPage
          in: query
          required: false
          description: Number of records per page. Must be a positive integer no greater than 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
          example: 5
      responses:
        "200":
          description: Collection returned successfully, including an empty page when page is out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItems"
              examples:
                firstPage:
                  summary: First page
                  value:
                    records:
                      - { id: item-001, name: Example item 1 }
                      - { id: item-002, name: Example item 2 }
                      - { id: item-003, name: Example item 3 }
                      - { id: item-004, name: Example item 4 }
                      - { id: item-005, name: Example item 5 }
                      - { id: item-006, name: Example item 6 }
                      - { id: item-007, name: Example item 7 }
                      - { id: item-008, name: Example item 8 }
                      - { id: item-009, name: Example item 9 }
                      - { id: item-010, name: Example item 10 }
                    pagination: { page: 1, perPage: 10, totalItems: 23, totalPages: 3 }
                outOfRangePage:
                  summary: Out-of-range page
                  value:
                    records: []
                    pagination: { page: 99, perPage: 10, totalItems: 23, totalPages: 3 }
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated identifier for correlating the request and response.
      schema: { type: string }
  responses:
    MethodNotAllowed:
      description: The endpoint exists but does not support the HTTP method used.
      headers:
        Allow:
          description: Comma-separated list of methods supported by this endpoint.
          schema: { type: string, example: "GET, HEAD" }
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            {
              type: about:blank,
              title: Method Not Allowed,
              status: 405,
              code: METHOD_NOT_ALLOWED,
              requestId: 01JEXAMPLE,
            }
    ValidationFailed:
      description: A supplied query parameter is invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: VALIDATION_FAILED
            requestId: 01JEXAMPLE
            errors:
              - { field: page, code: INVALID_INTEGER }
    InternalError:
      description: An unexpected server error occurred. Internal details are not exposed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            {
              type: about:blank,
              title: Internal Server Error,
              status: 500,
              code: INTERNAL_ERROR,
              requestId: 01JEXAMPLE,
            }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 60, maximum: 3600 }
        user: { $ref: "#/components/schemas/PublicUser" }
    Item:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1, example: item-001 }
        name: { type: string, minLength: 1, example: Example item }
    Pagination:
      type: object
      additionalProperties: false
      required: [page, perPage, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 500 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PaginatedItems:
      type: object
      additionalProperties: false
      required: [records, pagination]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details with stable application extensions.
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
      additionalProperties: true
