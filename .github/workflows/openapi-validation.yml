name: API Contract, Runtime, and Docker

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'compose.yaml'
      - '.dockerignore'
      - '.env.example'
      - 'README.md'
      - 'ROADMAP.md'
      - '.github/workflows/openapi-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'compose.yaml'
      - '.dockerignore'
      - '.env.example'
      - 'README.md'
      - 'ROADMAP.md'
      - '.github/workflows/openapi-validation.yml'

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate contract and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Validate OpenAPI specification
        run: npm run validate:openapi
      - name: Run API tests
        run: npm test
      - name: Type-check API
        run: npm run typecheck
      - name: Build API
        run: npm run build

  validate-docker:
    name: Validate Compose and build API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare local environment file
        run: cp .env.example .env
      - name: Validate core Compose configuration
        run: docker compose config --quiet
      - name: Validate optional tools configuration
        run: docker compose --profile tools config --quiet
      - name: Build API development image
        run: docker compose build api
